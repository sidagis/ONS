<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Den norske kontinentalsokkelen</title>

  <!-- ArcGIS Maps SDK for JavaScript 4.32 (last 4.x, stable). CDN load. -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.32/"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    /* ============================== BASE / LAYOUT ============================== */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      background: #fdfbfb;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
  touch-action: none;          /* no page pan/zoom/scroll at the document level */
  overscroll-behavior: none;   /* no pull-to-refresh / bounce */
}
#viewScaler, #viewDiv {
  touch-action: none;          /* SDK handles all map gestures itself via pointer events */
}
#buttonPanel, #titleOverlay, #legendBox,
.kioskBtn {
  touch-action: manipulation;  /* taps only — no double-tap or pinch zoom */
}
    #appRoot {
      position: absolute;
      inset: 0;
    }

    #viewScaler {
      position: absolute;
      inset: 0;
    }

    #viewDiv {
      position: absolute;
      inset: 0;
    }

    /* Hide the default ArcGIS UI we don't want on a kiosk. We keep zoom only. */
    .esri-ui-corner .esri-component.esri-attribution {
      display: none !important;
    }


    /* ============================== TITLE OVERLAY (floats ON the map) ============================== */
    #titleOverlay {
      position: absolute;
      top: 28px;
      left: 36px;
      display: flex;
      align-items: center;
      gap: 22px;
      z-index: 30;
      pointer-events: auto;
      cursor: pointer;
    }

    #titleLogo {
      flex: 0 0 auto;
      width: 170px;
      height: 170px;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    }

    #titleLogo svg {
      width: 100%;
      height: 100%;
    }

    #titleText {
      display: flex;
      flex-direction: column;
      line-height: 1.0;
      margin-top: 20px;
    }

    #titleText .line1 {
      font-size: 42px;
      font-weight: 800;
      color: #1d1d1b;
      letter-spacing: -0.5px;
      text-shadow:
        -1px -1px 0 #fff, 1px -1px 0 #fff,
        -1px 1px 0 #fff, 1px 1px 0 #fff,
        0 0 8px rgba(255, 255, 255, 0.9);
    }

    #titleText .line2 {
      font-size: 42px;
      font-weight: 800;
      color: #1d1d1b;
      letter-spacing: -1px;
      text-shadow:
        -1px -1px 0 #fff, 1px -1px 0 #fff,
        -1px 1px 0 #fff, 1px 1px 0 #fff,
        0 0 10px rgba(255, 255, 255, 0.9);
    }

    /* ============================== LEGEND (PNG placeholder) ============================== */
    #legendBox {
      position: absolute;
      left: 14px;
      bottom: 14px;
      width: 200px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #b9b9b9;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      padding: 10px;
      box-sizing: border-box;
      z-index: 25;
    }

    #legendSvg {
      display: block;
      width: 100%;
      height: auto;
    }

    #legendPlaceholder {
      width: 100%;
      height: 360px;
      border: 2px dashed #9aa4b0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #6b7682;
      font-size: 14px;
      padding: 12px;
      box-sizing: border-box;
    }

    /* ============================== BUTTON PANEL (right side) ============================== */
    #buttonPanel {
      position: absolute;
      top: 30px;
      right: 14px;
      width: 180px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 25;
    }

    .kioskBtn {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      padding: 9px 10px;
      box-sizing: border-box;
      border: none;
      border-radius: 5px;
      background: linear-gradient(135deg, #1b3a5b 0%, #2c5f8a 100%);
      color: #fff;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.30);
      transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .kioskBtn:active {
      transform: translateY(2px) scale(0.985);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.30);
      filter: brightness(1.12);
    }

    .kioskBtn .btnTitle {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      padding-top: 5px;
      padding-bottom: 5px;
    }

    .kioskBtn .btnSub {
      font-size: 13px;
      font-weight: 400;
      opacity: 0.85;
    }

    /* A subtle "tap me" affordance */
    .kioskBtn::after {
      content: "";
      position: absolute;
      filter: grayscale(1) brightness(3);
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      opacity: 0.55;
    }

    /* Group: navigation buttons (seas) get a distinct accent */
    .kioskBtn.nav {
      background: linear-gradient(135deg, #009640 0%, #009640 100%);
    }

    /* Group: thematic data buttons */
    .kioskBtn.data {
      background: linear-gradient(135deg, #004f9f 0%, #004f9f 100%);
    }

    .panelHeading {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.9;
      margin: 6px 4px 0 4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    /* ============================== LOADING / BUSY OVERLAY ============================== */
    #busy {
      position: absolute;
      inset: 0;
      background: rgba(13, 27, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      color: #fff;
      font-size: 20px;
    }

    #busy.show {
      display: flex;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-right: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Keep zoom buttons big enough for fingers */
    .esri-zoom .esri-widget--button {
      width: 54px;
      height: 54px;
      font-size: 22px;
    }


  #attract {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: translateY(-18%);
  gap: 34px;
  z-index: 9999;
  pointer-events: none;    
  opacity: 0;
  transition: opacity .45s ease;
}
#attract.show { opacity: 1; }

#attract .glow {
  position: absolute;
  left: 50%; top: 50%;
  width: 620px; height: 620px;
  margin: -310px 0 0 -310px;
  border-radius: 50%;
  background: radial-gradient(circle,
      rgba(255,255,255,.88) 0%,
      rgba(255,255,255,.55) 38%,
      rgba(255,255,255,0) 70%);
  animation: attractBreathe 5s ease-in-out infinite;
}
@keyframes attractBreathe {
  0%, 100% { transform: scale(1);    opacity: .92; }
  50%      { transform: scale(1.06); opacity: 1; }
}

/* Fixed box, never shrinks, and it is the positioning parent. */
#attract .rings {
  position: relative;
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
  z-index: 1;
}

/* Sized in pixels and self-centred, so it stays tied to the hand
   even if the parent box misbehaves. */
#attract .rings span {
  position: absolute;
  left: 50%; top: 50%;
  width: 132px; height: 132px;
  margin: 0;
  border: 3px solid rgba(0,90,130,.5);
  border-radius: 50%;
  will-change: transform, opacity;
  transform: translate(-50%,-50%) scale(.9);
  animation: attractRing 5s cubic-bezier(.22,.68,.28,1) infinite;
}
#attract .rings span:nth-child(n+2) { display: none; }

@keyframes attractRing {
  0%, 9%  { transform: translate(-50%,-50%) scale(.9);  opacity: 0; }
  13%     { opacity: .5; }
  60%     { transform: translate(-50%,-50%) scale(1.55); opacity: 0; }
  100%    { transform: translate(-50%,-50%) scale(1.55); opacity: 0; }
}

#attract .hand {
  position: absolute;
  left: 50%; top: 50%;
  width: 94px; height: 94px;
  margin: -37px 0 0 -37px;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  animation: attractTap 5s ease-in-out infinite;
}
#attract .hand svg {
  width: 74px; height: 74px;
  fill: rgba(126, 126, 126, 0.68);
  filter:
    drop-shadow(0 1px 2px rgba(255,255,255,.95))
    drop-shadow(0 3px 10px rgba(255,255,255,.8))
    drop-shadow(0 10px 22px rgba(0,0,0,.3));
}

@keyframes attractTap {
  0%, 5%, 20%, 100% { transform: translateY(0) scale(1); }
  9%                { transform: translateY(9px) scale(.93); }
  15%               { transform: translateY(0) scale(1); }
}

#attract .label {
  position: relative;
  z-index: 1;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: .01em;
  color: rgba(114, 114, 114, 0.501);
  text-align: center;
  text-shadow:
    0 1px 0    rgba(255,255,255,.95),
    0 2px 10px rgba(255,255,255,.9),
    0 4px 16px rgba(255,255,255,.65),
    0 10px 26px rgba(121, 120, 120, 0.3);
  transition: opacity .5s ease;
}
  </style>
</head>

  <script>
    /* ===========================================================================
       CONFIGURATION
       ===========================================================================*/
    const CONFIG = {
      portalItemId: "82a587d045a640b7b50fec52ffd2e7c5",

      factMaps: {
        layerId: "19ee103a7f1-layer-89",
        title: "FactMapsWGS84",
        urlContains: "Factmaps/FactMapsWGS84/MapServer"
      },

      // The always-on feature layer (portal layer id).
      alwaysOnFeatureLayerId: "19ee105df08-layer-119",
      graticuleLayerId: "19ee14e406f-layer-35",
      windLayerId: "19ffa06bd20-layer-34",
      TransportLayerId: "1a0146b7b3d-layer-34",

      // Sublayers that must ALWAYS be visible (FactMaps service sublayer ids).
      // 800 + its sublayers are pinned. We assert 800 and re-assert all its
      // descendants on every reset/action.
      pinnedSublayerIds: [800],

      // Idle timeout (ms) before resetting to initial state.
      idleMs: 25000,

      //Sets the extent of the NCS. Coordinates set for HD-standing-screen
      extents: {
        home: { xmin: -411910, ymin: 9431928, xmax: 2133095, ymax: 13090627 }
      }
    };
window.addEventListener("contextmenu", function (e) {
  e.preventDefault();
}, true);
    require([
      "esri/WebMap",
      "esri/views/MapView",
      "esri/geometry/Extent",
      "esri/layers/FeatureLayer",
      "esri/Basemap",
      "esri/core/reactiveUtils"
    ], function (WebMap, MapView, Extent, FeatureLayer, Basemap, reactiveUtils) {

      /* ---- State captured after load ---- */
      let factMapsLayer = null;       // the MapImageLayer
      let alwaysOnLayer = null;       // the always-on feature layer
      let defaultSublayerVis = {};    // { sublayerId: boolean } snapshot of portal defaults
      let defaultTopLayerVis = {};    // { layerId: boolean } snapshot for non-image layers
      let initialViewpoint = null;    // home viewpoint
      let idleTimer = null;
      let graticuleLayer = null;
      let windLayer = null;
      let defaultBasemap = null;
      let labelLayer = null;
      let transportLayer = null;
      

      const extentCache = {};
      const TOP_GROUP_IDS = [200, 300, 400, 500, 600];
      const busyEl = document.getElementById("busy");
      const seaQueryLayer = new FeatureLayer({
        url: "https://factmaps.sodir.no/api/rest/services/Factmaps/FactMapsWGS84/FeatureServer/803"
      });
      const MINERALS_BASEMAP = new Basemap({
        portalItem: { id: "d61ecc8ddb2d4784b2257f3956990769" }
      });

      function setBusy(on) { busyEl.classList.toggle("show", !!on); }


      

      const webmap = new WebMap({
        portalItem: { id: CONFIG.portalItemId }
      });

      const view = new MapView({

        container: "viewDiv",
        map: webmap,
        // Disable popups entirely — navigation only.
        popup: { autoOpenEnabled: false },
        ui: { components: [] } // keep zoom buttons; drop attribution/etc.
      });


      view.on("double-click", function (event) {
      });

      view.when(function () {



        locateLayers().then(function () {
                  // Turn off the MapImageLayer's per-ring labels for 502.
          const lbl502 = getSublayer(502);
          if (lbl502) lbl502.labelsVisible = false;

          // Add the FeatureServer 502 as a transparent, labels-only layer.
          labelLayer = new FeatureLayer({
            url: "https://factmaps.sodir.no/api/rest/services/Factmaps/FactMapsWGS84/FeatureServer/502",
            outFields: ["fldName"],
            renderer: {
              type: "simple", symbol: {
                type: "simple-fill", color: [0, 0, 0, 0], outline: { width: 0, color: [0, 0, 0, 0] }
              }
            },
            labelsVisible: true,
            labelingInfo: [{
              labelExpressionInfo: { expression: "$feature.fldName" },
              labelPlacement: "always-horizontal",
              symbol: {
                type: "text", color: [29, 29, 27, 1],
                haloColor: [255, 255, 255, 0.85], haloSize: 1, font: { size: 8, family: "Arial" }
              },
              minScale: 0, maxScale: 0
            }]
          });

          view.map.add(labelLayer);
          snapshotDefaults();

          goToExtent(CONFIG.extents.home, false).finally(function () {
            setTimeout(showAttract, 1500);
            initialViewpoint = view.viewpoint.clone();
            const homeScale = view.scale;
            view.constraints.minScale = homeScale * 2;
            view.constraints.maxScale = 0;
            armIdleTimer();
            
          });
        });
      }).catch(function (err) {
        console.error("View failed to load:", err);
      });
      
      document.getElementById("titleOverlay").addEventListener("click", function () {
  if (actionRunning) return;
  resetToDefaults();
  view.goTo(initialViewpoint || CONFIG.extents.home, { animate: false }).catch(function () {});
  interacted = true;
  armIdleTimer();
});

      function locateLayers() {
        const all = [];
        function walk(collection) {
          collection.forEach(function (lyr) {
            all.push(lyr);
            if (lyr.layers && lyr.layers.length) walk(lyr.layers);
          });
        }
        walk(webmap.layers);

        // FactMaps: prefer url match, then id, then title.
        factMapsLayer = all.find(function (l) {
          return l.url && l.url.indexOf(CONFIG.factMaps.urlContains) !== -1;
        }) || all.find(function (l) {
          return l.id === CONFIG.factMaps.layerId;
        }) || all.find(function (l) {
          return l.title === CONFIG.factMaps.title;
        }) || null;


        // Always-on layer by portal layer id.
        alwaysOnLayer = all.find(function (l) {
          return l.id === CONFIG.alwaysOnFeatureLayerId;
        }) || null;

        graticuleLayer = all.find(function (l) {
          return l.id === CONFIG.graticuleLayerId;
        }) || null;
        windLayer = all.find(function (l) {
          return l.id === CONFIG.windLayerId;
        }) || null;

        transportLayer = all.find(function (l) {
          return l.id === CONFIG.TransportLayerId;
        }) || null;        

        // Make sure the MapImageLayer and its sublayers are fully loaded so
        // findSublayerById works and sublayers collection is populated.
        const waits = [];
        if (factMapsLayer && factMapsLayer.load) waits.push(factMapsLayer.load());
        if (alwaysOnLayer && alwaysOnLayer.load) waits.push(alwaysOnLayer.load());
        if (graticuleLayer && graticuleLayer.load) waits.push(graticuleLayer.load());
        if (windLayer && windLayer.load) waits.push(windLayer.load());
        if (transportLayer && transportLayer.load) waits.push(transportLayer.load());

        return Promise.all(waits).catch(function (e) {
          console.warn("Layer load issue:", e);
        });
      }

      /* =========================================================================
         SNAPSHOT PORTAL DEFAULTS
         Record the visibility of every FactMaps sublayer and every top-level
         layer exactly as the portal item defines them, so "reset" is faithful.
         =========================================================================*/
      function eachSublayer(cb) {
        if (!factMapsLayer || !factMapsLayer.sublayers) return;
        // sublayers is a flat-ish collection but can be nested; walk recursively.
        function walk(coll) {
          coll.forEach(function (s) {
            cb(s);
            if (s.sublayers && s.sublayers.length) walk(s.sublayers);
          });
        }
        walk(factMapsLayer.sublayers);
      }

      function snapshotDefaults() {
        defaultSublayerVis = {};
        eachSublayer(function (s) { defaultSublayerVis[s.id] = !!s.visible; });

        defaultTopLayerVis = {};
        webmap.layers.forEach(function (l) { defaultTopLayerVis[l.id] = !!l.visible; });
        defaultBasemap = webmap.basemap;
      }

      /* =========================================================================
         HELPERS for sublayer / layer visibility
         =========================================================================*/
      function setSublayerVisible(id, vis) {
        if (!factMapsLayer) return;
        const s = factMapsLayer.findSublayerById(id);
        if (s) s.visible = !!vis;
      }
      function getSublayer(id) {
        return factMapsLayer ? factMapsLayer.findSublayerById(id) : null;
      }

      // Turn off every FactMaps sublayer.
      function allSublayersOff() {
        TOP_GROUP_IDS.forEach(function (id) { setSublayerVisible(id, false); });
      }

      // Turn off every top-level operational layer in the webmap.
      function allTopLayersOff() {
        webmap.layers.forEach(function (l) { l.visible = false; });
      }

      // Re-assert the pinned/always-on layers (call at the END of every action).
      function assertAlwaysOn() {
        // FactMaps must be visible as a container for its sublayers.
        if (factMapsLayer) factMapsLayer.visible = true;


        // Pin 800 and ALL of its descendant sublayers on.
        CONFIG.pinnedSublayerIds.forEach(function (pid) {
          const top = getSublayer(pid);
          if (top) {
            top.visible = true;
            if (top.sublayers && top.sublayers.length) {
              (function walk(coll) {
                coll.forEach(function (c) {
                  c.visible = true;
                  if (c.sublayers && c.sublayers.length) walk(c.sublayers);
                });
              })(top.sublayers);
            }
          }
        });

        // Always-on feature layer.
        if (alwaysOnLayer) alwaysOnLayer.visible = true;
        if (graticuleLayer) graticuleLayer.visible = true;
      }

      /* =========================================================================
         RESET TO PORTAL DEFAULTS
         Restore the snapshot, then re-assert always-on. Used at the start of
         every button action and on idle reset.
         =========================================================================*/
      function resetToDefaults() {
        eachSublayer(function (s) {
          if (s.id in defaultSublayerVis) s.visible = defaultSublayerVis[s.id];
        });
        webmap.layers.forEach(function (l) {
          if (l.id in defaultTopLayerVis) l.visible = defaultTopLayerVis[l.id];
        });
        if (defaultBasemap) webmap.basemap = defaultBasemap; 
        assertAlwaysOn();
      }


      function resolveLayerExtent(layer) {
        if (!layer) return Promise.resolve(null);
        const key = "lyr:" + layer.id;
        if (extentCache[key]) return Promise.resolve(extentCache[key]);

        function done(ext) {
          if (ext) extentCache[key] = ext;
          return ext;
        }
        function fallback() {
          return layer.fullExtent ? layer.fullExtent.expand(1.15) : null;
        }

        if (layer.queryExtent) {
          return layer.queryExtent().then(function (res) {
            const ext = (res && res.extent) ? res.extent.expand(1.15) : fallback();
            return done(ext);
          }).catch(function () { return done(fallback()); });
        }
        return Promise.resolve(done(fallback()));
      }

      function goToLayerExtent(layer) {
        return resolveLayerExtent(layer).then(function (ext) {
          if (ext) return view.goTo(ext, { duration: 900 }).catch(function () { });
        });
      }

      function goToExtent(extObj, animate) {
        const ext = new Extent({
          xmin: extObj.xmin, ymin: extObj.ymin,
          xmax: extObj.xmax, ymax: extObj.ymax,
          spatialReference: { wkid: 3857 }
        });
        return view.goTo(ext, { animate: animate !== false, duration: 900 })
          .catch(function () { });
      }

      function resolveSublayerExtent(sublayerId) {
        const key = "sub:" + sublayerId;
        if (extentCache[key]) return Promise.resolve(extentCache[key]);
        const s = getSublayer(sublayerId);
        if (!s) return Promise.resolve(null);
        return s.createFeatureLayer().then(function (fl) {
          return fl.queryExtent().then(function (res) {
            const ext = res && res.extent ? res.extent.expand(1.15) : null;
            if (ext) extentCache[key] = ext;
            return ext;
          });
        }).catch(function () { return null; });
      }

      function goToSublayerExtent(sublayerId) {
        return resolveSublayerExtent(sublayerId).then(function (ext) {
          if (ext) return view.goTo(ext, { duration: 900 }).catch(function () { });
        });
      }

      function resolveAlwaysOnExtent() {
        const key = "alwayson";
        if (extentCache[key]) return Promise.resolve(extentCache[key]);
        if (!alwaysOnLayer) return Promise.resolve(null);
        if (alwaysOnLayer.fullExtent) {
          extentCache[key] = alwaysOnLayer.fullExtent.expand(1.15);
          return Promise.resolve(extentCache[key]);
        }
        if (alwaysOnLayer.queryExtent) {
          return alwaysOnLayer.queryExtent().then(function (res) {
            const ext = res && res.extent ? res.extent.expand(1.15) : null;
            if (ext) extentCache[key] = ext;
            return ext;
          }).catch(function () { return null; });
        }
        return Promise.resolve(null);
      }
      function goToSea(whereClause) {
        const s = getSublayer(803);
        if (!s) return Promise.resolve();
        return s.createFeatureLayer().then(function (fl) {
          return fl.queryExtent({ where: whereClause }).then(function (res) {
            if (res && res.extent) {
              return view.goTo(res.extent.expand(1.1), { animate: true }).catch(function () { });
            }
          });
        }).catch(function (e) { console.warn("803 sea query failed:", whereClause, e); });
      }

      function goToAlwaysOnExtent() {
        return resolveAlwaysOnExtent().then(function (ext) {
          if (ext) return view.goTo(ext, { duration: 900 }).catch(function () { });
        });
      }

      const actions = {
        northsea: function () { return goToSea("qadName < '1000'"); },
        norwegiansea: function () { return goToSea("qadName >= '1000' AND qadName <= '6900'"); },
        barents: function () { return goToSea("qadName > '6900'"); },

        fields: function () {
          // hydrocarbon
          resetToDefaults();
          allTopLayersOff();
          allSublayersOff();
          setSublayerVisible(500, true);
          setSublayerVisible(502, true);
          setSublayerVisible(600, true);
          setSublayerVisible(625, false);
          setSublayerVisible(611, false);
          setSublayerVisible(503, true);
          labelLayer.visible = true;
          assertAlwaysOn();
          return goToSublayerExtent(502);
        },

        explorationwells: function () {
          //current wells
          resetToDefaults();
          setSublayerVisible(300, false)
          setSublayerVisible(200, true);
          setSublayerVisible(307, true);                       
          labelLayer.visible = false;
          assertAlwaysOn();
          return goToSublayerExtent(203);
        },

        co2: function () {
          resetToDefaults();
          allTopLayersOff();
          allSublayersOff();
          setSublayerVisible(626, true);
          setSublayerVisible(625, true);
          setSublayerVisible(600, true);
          setSublayerVisible(611, false);
          labelLayer.visible = false;
          assertAlwaysOn();
          return goToSublayerExtent(626);
        },

        wind: function () {
          resetToDefaults();
          allTopLayersOff();
          allSublayersOff();
          labelLayer.visible = false;
          assertAlwaysOn();
           windLayer.visible = true;
          if (windLayer.parent && windLayer.parent.visible === false) {
            windLayer.parent.visible = true;
          }

          return goToLayerExtent(windLayer);
        },

        transport: function () {
          resetToDefaults();
          allTopLayersOff();
          allSublayersOff();
          labelLayer.visible = false;          
          setSublayerVisible(500, true);
          setSublayerVisible(502, true);
          setSublayerVisible(300, true);
          setSublayerVisible(304, true);
          setSublayerVisible(307, true);          
          setSublayerVisible(311, false);          
          setSublayerVisible(503, true);
          assertAlwaysOn();
           transportLayer.visible = true;
          if (transportLayer.parent && transportLayer.parent.visible === false) {
            transportLayer.parent.visible = true;
          }

          return goToLayerExtent(transportLayer);
        },        

        minerals: function () {
          resetToDefaults();
          allTopLayersOff();
          allSublayersOff();
          labelLayer.visible = false;
          setSublayerVisible(900, true);
          setSublayerVisible(901, true);
          assertAlwaysOn();
  webmap.basemap = MINERALS_BASEMAP;

          return goToSublayerExtent(901);
        }
      };

      /* =========================================================================
         WIRE UP BUTTONS
         =========================================================================*/
      let actionRunning = false;
      document.querySelectorAll(".kioskBtn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const key = btn.getAttribute("data-action");
          if (!actions[key] || actionRunning) return;
          actionRunning = true;
          Promise.resolve(actions[key]()).finally(function () {
            actionRunning = false;
            interacted = true;
            armIdleTimer();
          });
        });
      });

const attractEl    = document.getElementById("attract");
const attractLabel = document.getElementById("attractLabel");
const ATTRACT_TEXT = ["Touch to explore"];
let attractIdx = 0;
let attractCycle = null;

function attractNode() { return document.getElementById("attract"); }

function showAttract() {
  const el = attractNode();
  if (!el) { console.warn("attract element not found"); return; }
  if (el.classList.contains("show")) return;
  el.classList.add("show");

  const label = document.getElementById("attractLabel");
  if (!label || ATTRACT_TEXT.length < 2) return;   // nothing to rotate

  attractCycle = setInterval(function () {
    attractIdx = (attractIdx + 1) % ATTRACT_TEXT.length;
    label.style.opacity = 0;
    setTimeout(function () {
      label.textContent = ATTRACT_TEXT[attractIdx];
      label.style.opacity = 1;
    }, 500);
  }, 4000);
}

function hideAttract() {
  const el = attractNode();
  if (!el || !el.classList.contains("show")) return;
  el.classList.remove("show");
  if (attractCycle) { clearInterval(attractCycle); attractCycle = null; }
}
  
  //       IDLE RESET 
  //       IDLE RESET
      // Has anybody used the kiosk since the last reset? Without this the
      // stand re-runs resetToDefaults() and an animated goTo every 25
      // seconds all night, thousands of times, for nobody.
      let interacted = false;
      let lastLoadAt = Date.now();
      const RELOAD_AFTER_IDLE_MS = 30 * 60 * 1000;

      function armIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(idleReset, CONFIG.idleMs);
      }

      function idleReset() {
        showAttract();

        if (interacted) {
          interacted = false;
          resetToDefaults();
          if (initialViewpoint) {
            view.goTo(initialViewpoint, { duration: 900 }).catch(function () { });
          } else {
            goToExtent(CONFIG.extents.home);
          }
        } else if (Date.now() - lastLoadAt > RELOAD_AFTER_IDLE_MS) {
          // Nobody has touched it since the last reset and this document
          // has been alive a long time. One full reload as housekeeping -
          // it can only ever happen with the stand unattended.
          location.reload();
          return;
        }

        armIdleTimer();
      }

      // Reset the idle timer on real interaction. pointermove fires up to
      // ~120x/s during a pan and each one was doing a clearTimeout, a
      // setTimeout and a getElementById, so it is throttled.
      let lastMoveArm = 0;

      function noteInteraction() {
        interacted = true;
        armIdleTimer();
        hideAttract();
      }

      ["pointerdown", "pointerup", "wheel", "touchstart", "keydown"]
        .forEach(function (evt) {
          window.addEventListener(evt, noteInteraction, { passive: true });
        });

      window.addEventListener("pointermove", function () {
        const now = Date.now();
        if (now - lastMoveArm < 250) return;
        lastMoveArm = now;
        noteInteraction();
      }, { passive: true });
      // Map view interactions (pan/zoom) also count.
      

    }); // require

  </script>
</body>

</html>
