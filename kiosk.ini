; =====================================================================
;  kiosk.ini  -  the only file you need to edit
;  Save the file, then restart the kiosk (double-click "Start Kiosk").
;  Lines starting with ; are comments and are ignored.
; =====================================================================

[Kiosk]

; The published ArcGIS Experience Builder app URL.
; Paste it straight from the browser address bar.
AppUrl=https://experience.arcgis.com/experience/e800db567b7a4774b8db75768a5b5052

; Seconds of no touch, mouse or key input before the app resets itself.
IdleSeconds=90

; 1 = swallow every keystroke except Alt+F4.  0 = keys work normally
; (use 0 while testing).
BlockAllKeys=1

; 1 = block right-click and long-press context menus.
; NOTE: set this to 0 while setting up, or you cannot open the kiosk
; tray menu (which is where "Mark video area" lives).
BlockMouseButtons=1

; 1 = block the scroll wheel too. Leave 0 unless a mouse is attached
; and you do not want visitors zooming the map with it.
BlockWheel=0

; 1 = Alt+F4 also starts Explorer, so whoever exits gets a desktop.
ExitToDesktop=1


; ---------------------------------------------------------------------
;  Video: do not reset while something is playing
; ---------------------------------------------------------------------

; 1 = hold the reset while Edge is feeding audio to Windows.
; IMPORTANT: this works while the SPEAKERS are muted, because Edge is
; still producing the stream. It does NOT work if the video is muted in
; the player itself. Mute Windows, never the player - see MuteOutput.
HoldForAudio=1

; 1 = an active audio session from ANY process counts as a video.
; On a kiosk nothing else makes sound, and it means detection still works
; if Windows attributes the stream to something other than msedge.exe.
AudioAnyProcess=1

; 1 = mute the Windows playback device at startup, every time.
; This is the right way to get a silent kiosk while keeping the audio
; signal above alive. Do not use the player's mute button instead.
MuteOutput=1

; Screen area of the video, as x1,y1,x2,y2. When set, the kiosk holds
; the reset while the pixels in that area keep changing. This is the
; backstop for the case where a visitor mutes the player by hand.
; To fill it in: set BlockMouseButtons=0, start the kiosk, right-click
; the tray icon, choose "Mark video area", tap two opposite corners.
VideoRect=

; --- telling a video apart from a rotating image banner ---
; A banner that cycles images also changes pixels, so change alone is not
; enough. What separates them is how constant the change is: a video
; changes on nearly every frame, a banner changes for a moment and then
; holds still. The area is sampled several times a second and playback is
; declared only when most of a rolling window shows change.
;
; To tune: tray icon -> "Motion meter (30s)". Run it once with the video
; playing and once with only the banner rotating, then put
; MotionSustainPercent between the two readings.

; How often to sample the area, in milliseconds.
MotionSampleMs=250

; Length of the rolling window, in milliseconds.
MotionWindowMs=3000

; Percentage of that window which must show change before it counts as a
; video. Raise it if a banner is being mistaken for the video; lower it
; if the video is not being picked up.
MotionSustainPercent=70

; Percentage of the sample points that must change for one sample to
; count as movement. Stops a single flickering pixel reading as a video.
MotionPointsPercent=15

; 1 = stop Edge putting video on a hardware overlay plane. Overlays keep
; video frames out of the desktop image, which makes a playing video look
; like a static black box to the detector above. Leave this on if you
; rely on VideoRect.
DisableVideoOverlay=1

; Absolute ceiling on holding the reset back, in seconds. Even if a
; detector sticks, the app resets after this. Set it to your longest
; video plus about a minute. A 2 minute video -> 180.
MaxHoldSeconds=180

; Once the video stops, wait this many seconds before resetting.
PostVideoSeconds=20


; ---------------------------------------------------------------------
;  Reset speed
; ---------------------------------------------------------------------

; 1 = instant reset. The wrapper keeps a second, already-loaded copy of
; the app waiting out of sight and swaps to it, so there is no reload
; and no loading screen. Falls back to a normal reload by itself if the
; standby copy is not ready.
FastReset=1

; 1 = show the wrapper's debug overlay in the corner: which copy is
; active, whether a standby is ready, how many resets have happened.
; Unlike setting StartUrl by hand, this keeps fast reset working.
WrapperDebug=0

; How many seconds before the reset to start loading the standby copy.
; It needs to be long enough for your app to finish loading. Raise it if
; resets are still showing the loading screen.
;
; The standby is never built while a video is playing: a second copy of
; the app means a second video player, and Vimeo pauses one player when
; another starts. After a long video ends, the standby starts loading
; immediately and has PostVideoSeconds to get ready.
PrewarmSeconds=12

; 1 = if the swap cannot be confirmed, reload the page instead.
; 0 = trust the swap and never reload. Use 0 when resets work but are
; never acknowledged, which happens on some Edge builds: the fallback
; then fires every time, and the reload it does is the loading screen you
; were trying to get rid of. With 0 the kiosk cannot tell a failed swap
; from a successful one, which is what IdleReloadMinutes below covers.
ResetFallback=0

; Minutes of no visitor input at all before doing one full reload, as
; housekeeping and as a safety net in case a swap silently stopped
; working. It only ever runs on a kiosk nobody is using, and only once
; per quiet spell. 0 = never.
IdleReloadMinutes=30

; Milliseconds to hold the loading screen after a cold load. Only
; affects the first load and the fallback path, never a fast reset.
; 0 shows the app the moment it reports ready.
RevealDelayMs=250


; ---------------------------------------------------------------------
;  Advanced - you can normally ignore everything below.
; ---------------------------------------------------------------------

; Leave blank to find Microsoft Edge automatically.
EdgeExe=

; Leave blank to use the bundled wrapper page (recommended).
; Setting this to a URL loads it directly and skips the wrapper, which
; also disables FastReset.
StartUrl=

; Where Edge keeps its kiosk profile. Keeping it makes reloads faster,
; because the app's files stay in the browser cache.
UserDataDir=C:\KioskProfile

; 1 = delete that profile at every start. Slower, and there is normally
; no reason to.
ClearProfileOnStart=0

; Seconds to wait for the app before showing "Reconnecting".
LoadTimeoutSeconds=25
