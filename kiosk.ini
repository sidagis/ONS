; =====================================================================
;  kiosk.ini  -  the only file you need to edit
;  Save the file, then restart the kiosk (double-click "Start Kiosk").
;  Lines starting with ; are comments and are ignored.
; =====================================================================

[Kiosk]

; The published ArcGIS Experience Builder app URL.
; Paste it straight from the browser address bar.
AppUrl=https://experience.arcgis.com/experience/e800db567b7a4774b8db75768a5b5052

; Seconds of no touch, mouse or key input before the app resets itself.
IdleSeconds=25

; 1 = swallow every keystroke except Alt+F4.  0 = keys work normally
; (use 0 only while testing).
BlockAllKeys=1

; 1 = block right-click and long-press context menus.
BlockMouseButtons=1

; 1 = block the scroll wheel too. Leave 0 unless a mouse is attached
; and you do not want visitors zooming the map with it.
BlockWheel=0

; 1 = Alt+F4 also starts Explorer, so whoever exits gets a desktop.
ExitToDesktop=1

; ---------------------------------------------------------------------
;  Advanced - you can normally ignore everything below.
; ---------------------------------------------------------------------

; Leave blank to find Microsoft Edge automatically.
EdgeExe=

; Leave blank to use the bundled wrapper page (recommended).
; Set this to a URL to load something else directly and skip the
; wrapper - useful if ArcGIS refuses to be framed. The idle reset,
; the lockdown and the watchdog all still work.
StartUrl=

; Where Edge keeps its kiosk profile.
UserDataDir=C:\KioskProfile

; 1 = delete that profile at every start (cleanest, slower first load).
ClearProfileOnStart=0

; Seconds to wait for the app before showing "Reconnecting".
LoadTimeoutSeconds=25

; Milliseconds to keep the loading screen up after the app reports
; ready. Raise this if visitors see a half-drawn map.
RevealDelayMs=1400
