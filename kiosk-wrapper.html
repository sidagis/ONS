<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kiosk</title>
<style>
  :root{
    --bg:#0a1f2b;
    --fg:#e7f2f6;
    --dim:#7ba3b2;
    --accent:#22c1e0;
  }
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;}
  *,*::before,*::after{
    box-sizing:border-box;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* Two stacked copies of the app. The active one sits on top; the
     standby stays behind it, loaded and painted, ready to swap in. */
  .slot{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);}
  .slot[data-role="active"]{z-index:2;}
  .slot[data-role="standby"]{z-index:1;pointer-events:none;}

  /* Small trigger zones for the controller. Transparent, and they only
     respond to a mouse click, never to a finger. */
  .zone{position:fixed;top:0;width:12px;height:12px;z-index:9;background:transparent;}
  #zoneReset{left:0;}
  #zoneWarm{right:0;}

  #veil{
    position:fixed;inset:0;z-index:20;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
    padding:2rem;text-align:center;
    background:var(--bg);color:var(--fg);
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  }
  #veil[data-on="1"]{display:flex;}
  .ring{
    width:3.25rem;height:3.25rem;border-radius:50%;
    border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  #veil[data-spin="0"] .ring{display:none;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
  #veil p{margin:0;font-size:clamp(1rem,1.5vw,1.4rem);letter-spacing:.01em;color:var(--dim);max-width:32ch;line-height:1.5;}

  #dbg{
    position:fixed;left:0;bottom:0;z-index:30;display:none;
    padding:.45rem .7rem;background:rgba(0,0,0,.7);color:#6f6;
    font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre;pointer-events:none;
  }
  #dbg[data-on="1"]{display:block;}
</style>
</head>
<body>

<iframe id="slotA" class="slot" data-role="active"  title="Kiosk application" allow="geolocation; fullscreen; autoplay" allowfullscreen></iframe>
<iframe id="slotB" class="slot" data-role="standby" title="Kiosk application standby" allow="geolocation; fullscreen; autoplay" allowfullscreen></iframe>

<div id="zoneReset"></div>
<div id="zoneWarm"></div>

<div id="veil" data-on="1" data-spin="1">
  <div class="ring"></div>
  <p id="veilmsg">Loading the map</p>
</div>

<div id="dbg"></div>

<!-- Generated from kiosk.ini every time kiosk-lock.ahk starts. -->
<script src="kiosk-config.js"></script>

<script>
(function () {
  "use strict";

  const DEFAULTS = {
    appUrl: "",
    idleSeconds: 25,
    loadTimeoutSeconds: 25,
    revealDelayMs: 250,
    fastReset: true,
    retrySeconds: 10
  };
  const CONFIG = Object.assign({}, DEFAULTS, window.KIOSK_CONFIG || {});

  // How long after the standby copy fires its load event before it is
  // considered safe to show. Experience Builder keeps drawing for a
  // moment after load, and this is what buys the instant swap.
  const SETTLE_MS = 2500;

  /*
   * How the reset works
   *
   * Idle detection is in kiosk-lock.ahk, because events inside a
   * cross-origin iframe are invisible to this page - a timer here would
   * reset the app while a visitor was panning the map.
   *
   * The controller then triggers a reset by clicking a 12px zone in the
   * top-left corner. A finger can't do it: the handler ignores anything
   * that isn't pointerType "mouse", and the kiosk has no mouse. A click
   * in the top-right zone means "start warming the standby copy".
   *
   * This page publishes a token in document.title - which is the Edge
   * window title - so the controller can confirm the swap happened. If
   * it didn't, the controller sends F5 instead. Every failure path ends
   * in a working reset, just a slower one.
   */

  const slots = [document.getElementById("slotA"), document.getElementById("slotB")];
  const veil  = document.getElementById("veil");
  const msg   = document.getElementById("veilmsg");
  const dbg   = document.getElementById("dbg");

  const DEBUG = new URLSearchParams(location.search).has("debug");
  if (DEBUG) dbg.dataset.on = "1";

  // Ignore a second reset trigger this soon after one was honoured. The
  // controller can click twice if it can't confirm the first click fast
  // enough, and without this lock the duplicate falls through to a full
  // reload - which is the loading screen we are trying to eliminate.
  const RESET_LOCK_MS = 5000;

  const SID = Math.random().toString(36).slice(2, 6);
  let resetCount = 0;
  let trigCount = 0;
  let lastResetAt = 0;

  let active = 0;                 // index into slots
  let loadTimer = null, retryTimer = null;
  let warmState = "cold";         // cold | loading | ready
  let warmReadyAt = 0;

  function other() { return active === 0 ? 1 : 0; }

  /* ---------- title token ---------- */

  // Every trigger bumps the token, honoured or not, so the controller
  // sees its click land immediately and has no reason to click again.
  function publish() {
    const t = "Kiosk|r" + SID + "-" + resetCount + "." + trigCount + "|" + warmState[0];
    if (document.title !== t) document.title = t;
  }

  /* ---------- veil ---------- */

  function showVeil(text, spin) {
    msg.textContent = text;
    veil.dataset.spin = spin === false ? "0" : "1";
    veil.dataset.on = "1";
  }
  function hideVeil() { veil.dataset.on = "0"; }

  /* ---------- cold load ---------- */

  function urlOK() {
    return CONFIG.appUrl && CONFIG.appUrl.indexOf("REPLACE_ME") === -1;
  }

  function coldLoad() {
    if (!urlOK()) {
      showVeil("No Experience URL is set. Open kiosk.ini and put your published app URL after AppUrl=", false);
      return;
    }
    clearTimeout(loadTimer);
    clearTimeout(retryTimer);
    showVeil("Loading the map");

    const a = slots[active];
    a.onload = function () {
      clearTimeout(loadTimer);
      setTimeout(hideVeil, CONFIG.revealDelayMs);
    };
    loadTimer = setTimeout(function () {
      showVeil("Reconnecting");
      retryTimer = setTimeout(coldLoad, CONFIG.retrySeconds * 1000);
    }, CONFIG.loadTimeoutSeconds * 1000);

    a.src = CONFIG.appUrl;
  }

  /* ---------- prewarm ---------- */

  function prewarm() {
    if (!CONFIG.fastReset || !urlOK()) return;
    if (warmState !== "cold") return;

    const b = slots[other()];
    warmState = "loading";
    publish();

    b.onload = function () {
      warmReadyAt = Date.now() + SETTLE_MS;
      setTimeout(function () {
        if (warmState === "loading") { warmState = "ready"; publish(); }
      }, SETTLE_MS);
    };
    b.src = CONFIG.appUrl;
  }

  function warmUsable() {
    return warmState === "ready" && Date.now() >= warmReadyAt;
  }

  /* ---------- reset ---------- */

  function reset() {
    if (CONFIG.fastReset && warmUsable()) {
      swap();
    } else {
      // Nothing warm to show, so do it the slow way.
      resetCount++;
      publish();
      location.reload();
    }
  }

  function swap() {
    const oldSlot = slots[active];
    const newSlot = slots[other()];

    newSlot.dataset.role = "active";
    oldSlot.dataset.role = "standby";
    active = other();

    resetCount++;
    warmState = "cold";
    warmReadyAt = 0;
    publish();

    // Drop the copy the last visitor used, so only one live instance of
    // the app is running between resets.
    setTimeout(function () {
      try { oldSlot.onload = null; oldSlot.src = "about:blank"; } catch (e) {}
    }, 400);
  }

  function onResetTrigger() {
    trigCount++;
    publish();                                   // acknowledge instantly
    if (Date.now() - lastResetAt < RESET_LOCK_MS) return;   // duplicate click
    lastResetAt = Date.now();
    reset();
  }

  window.kioskReset  = reset;      // for a maintenance console
  window.kioskWarm   = prewarm;

  /* ---------- controller trigger zones ---------- */

  function zone(id, fn) {
    document.getElementById(id).addEventListener("pointerdown", function (e) {
      if (e.pointerType !== "mouse") return;   // a finger must never trigger this
      e.preventDefault();
      fn();
    });
  }
  zone("zoneReset", onResetTrigger);
  zone("zoneWarm", prewarm);

  /* ---------- input guards ---------- */

  ["contextmenu","dragstart","selectstart","gesturestart"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });

  window.addEventListener("keydown", function (e) {
    if (e.altKey && e.key === "F4") return;   // the one permitted escape
    e.preventDefault();
  }, { capture: true });

  window.addEventListener("wheel", function (e) {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  /* ---------- diagnostics ---------- */

  if (DEBUG) {
    setInterval(function () {
      dbg.textContent =
        "app url:   " + CONFIG.appUrl +
        "\nactive:    slot" + (active === 0 ? "A" : "B") +
        "\nstandby:   " + warmState + (warmState === "ready" ? (warmUsable() ? " (usable)" : " (settling)") : "") +
        "\nresets:    " + resetCount + "  (triggers " + trigCount + ")" +
        "\nfast:      " + CONFIG.fastReset +
        "\ntitle:     " + document.title;
    }, 500);
  }

  /* ---------- go ---------- */
  publish();
  coldLoad();
})();
</script>
</body>
</html>
